<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Skill Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="skill-section" id="skillSection">
        <div class="container">
            <p>My Technical Expertise</p>
            <h1>My Skill</h1>
            <p class="description">Technology and Tools I use to build web application</p>

            <div class="skill">
                <div class="skill-info">
                    <span>HTML</span>
                    <span>90%</span>
                </div>
                <div class="progress-container">
                    <div class="progress" data-width="90%"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>CSS</span>
                    <span>80%</span>
                </div>
                <div class="progress-container">
                    <div class="progress" data-width="80%"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>JavaScript</span>
                    <span>75%</span>
                </div>
                <div class="progress-container">
                    <div class="progress" data-width="75%"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>React.Js</span>
                    <span>70%</span>
                </div>
                <div class="progress-container">
                    <div class="progress" data-width="70%"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>Node.JS</span>
                    <span>65%</span>
                </div>
                <div class="progress-container">
                    <div class="progress" data-width="65%"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>Express.JS</span>
                    <span>60%</span>
                </div>
                <div class="progress-container">
                    <div class="progress" data-width="60%"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>MongoDB</span>
                    <span>55%</span>
                </div>
                <div class="progress-container">
                    <div class="progress" data-width="55%"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>Github</span>
                    <span>50%</span>
                </div>
                <div class="progress-container">
                    <div class="progress" data-width="50%"></div>
                </div>
            </div>

        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
